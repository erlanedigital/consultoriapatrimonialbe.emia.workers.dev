<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-box {
    width: 512px;
    height: 512px;
    background: linear-gradient(135deg, #5A1220 0%, #3D0C16 100%);
    border-radius: 113px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 13px solid #C9A86A;
    box-shadow: inset 0 0 51px rgba(201, 168, 106, 0.3);
  }
  .em-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 225px;
    font-weight: bold;
    color: #F3E7C4;
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .sub-text {
    font-family: system-ui, sans-serif;
    font-size: 46px;
    font-weight: 800;
    color: #C9A86A;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin-top: 15px;
  }
</style>
</head>
<body>
  <div class="icon-box">
    <div class="em-text">EM</div>
    <div class="sub-text">Erlane Mota</div>
  </div>
</body>
</html>
