<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgWine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58101E"/>
      <stop offset="45%" stop-color="#420B16"/>
      <stop offset="100%" stop-color="#1F040A"/>
    </linearGradient>

    <!-- Metallic Gold Shimmer Gradient -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#F3D58C"/>
      <stop offset="50%" stop-color="#D8AC52"/>
      <stop offset="75%" stop-color="#BF9038"/>
      <stop offset="100%" stop-color="#8C6219"/>
    </linearGradient>

    <!-- Linear Gold Frame -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6219" stop-opacity="0.2"/>
      <stop offset="20%" stop-color="#E5C175"/>
      <stop offset="50%" stop-color="#FFF3DC"/>
      <stop offset="80%" stop-color="#E5C175"/>
      <stop offset="100%" stop-color="#8C6219" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8C377" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C59A45" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Monogram -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgWine)"/>
  
  <!-- Subtle Internal Glow -->
  <circle cx="256" cy="230" r="220" fill="url(#centerGlow)"/>

  <!-- Luxury Double Border -->
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="url(#goldLine)" stroke-width="2.5" opacity="0.65"/>
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="url(#goldLine)" stroke-width="1" opacity="0.3"/>

  <!-- Corner Ornamental Accents -->
  <circle cx="56" cy="56" r="3" fill="#E5C175" opacity="0.8"/>
  <circle cx="456" cy="56" r="3" fill="#E5C175" opacity="0.8"/>
  <circle cx="56" cy="456" r="3" fill="#E5C175" opacity="0.8"/>
  <circle cx="456" cy="456" r="3" fill="#E5C175" opacity="0.8"/>

  <!-- Central Circular Golden Crest -->
  <circle cx="256" cy="225" r="148" fill="none" stroke="url(#goldLine)" stroke-width="1.8" opacity="0.4"/>
  <circle cx="256" cy="225" r="141" fill="none" stroke="url(#goldLine)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Golden Serif Monogram EM -->
  <text x="256" y="272" 
        font-family="'Fraunces', 'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="162" 
        font-weight="600" 
        letter-spacing="4" 
        fill="url(#goldShine)" 
        text-anchor="middle" 
        filter="url(#shadow)">EM</text>

  <!-- Ornamental Divider with Central Diamond -->
  <line x1="140" y1="316" x2="372" y2="316" stroke="url(#goldLine)" stroke-width="1.6"/>
  <polygon points="256,310 262,316 256,322 250,316" fill="url(#goldShine)"/>
  <circle cx="138" cy="316" r="2" fill="#E5C175"/>
  <circle cx="374" cy="316" r="2" fill="#E5C175"/>

  <!-- Brand Typography -->
  <text x="256" y="362" 
        font-family="'Plus Jakarta Sans', 'Manrope', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#FAF5EB" 
        text-anchor="middle">ERLANE MOTA</text>

  <text x="256" y="398" 
        font-family="'Plus Jakarta Sans', 'Manrope', system-ui, -apple-system, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="5.5" 
        fill="#D4B06A" 
        text-anchor="middle">CONSULTORIA PATRIMONIAL</text>
</svg>