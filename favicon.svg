<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgWine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58101E"/>
      <stop offset="45%" stop-color="#420B16"/>
      <stop offset="100%" stop-color="#1F040A"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#F3D58C"/>
      <stop offset="50%" stop-color="#D8AC52"/>
      <stop offset="75%" stop-color="#BF9038"/>
      <stop offset="100%" stop-color="#8C6219"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6219" stop-opacity="0.2"/>
      <stop offset="20%" stop-color="#E5C175"/>
      <stop offset="50%" stop-color="#FFF3DC"/>
      <stop offset="80%" stop-color="#E5C175"/>
      <stop offset="100%" stop-color="#8C6219" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8C377" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C59A45" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full square base for maskable/any Android & iOS icons -->
  <rect width="512" height="512" fill="url(#bgWine)"/>
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="256" cy="235" r="210" fill="url(#centerGlow)"/>

  <!-- Luxury Double Border -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldLine)" stroke-width="3" opacity="0.7"/>
  <rect x="38" y="38" width="436" height="436" rx="82" fill="none" stroke="url(#goldLine)" stroke-width="1.2" opacity="0.35"/>

  <!-- Circular Crest -->
  <circle cx="256" cy="225" r="146" fill="none" stroke="url(#goldLine)" stroke-width="2" opacity="0.45"/>
  <circle cx="256" cy="225" r="139" fill="none" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Golden Serif Monogram EM -->
  <text x="256" y="276" 
        font-family="'Georgia', 'Times New Roman', serif" 
        font-size="168" 
        font-weight="bold" 
        letter-spacing="4" 
        fill="url(#goldShine)" 
        text-anchor="middle">EM</text>

  <!-- Ornamental Divider -->
  <line x1="140" y1="318" x2="372" y2="318" stroke="url(#goldLine)" stroke-width="1.8"/>
  <polygon points="256,312 262,318 256,324 250,318" fill="url(#goldShine)"/>
  <circle cx="138" cy="318" r="2.5" fill="#E5C175"/>
  <circle cx="374" cy="318" r="2.5" fill="#E5C175"/>

  <!-- Brand Signature -->
  <text x="256" y="364" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#FAF5EB" 
        text-anchor="middle">ERLANE MOTA</text>

  <text x="256" y="400" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="5.5" 
        fill="#D4B06A" 
        text-anchor="middle">CONSULTORIA PATRIMONIAL</text>
</svg>